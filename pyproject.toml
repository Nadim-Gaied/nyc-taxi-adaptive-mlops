[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "nyc-taxi-adaptive-mlops"
version = "0.1.0"
description = "Historical-production replay for adaptive NYC taxi demand forecasting"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "lightgbm>=4.6,<5",
  "matplotlib>=3.9,<4",
  "pandas>=2.2,<3.0",
  "pyarrow>=15",
  "PyYAML>=6,<7",
  "scikit-learn>=1.5,<2",
]

[project.optional-dependencies]
dev = [
  "pytest>=8,<9",
  "ruff>=0.6,<1",
]

[project.scripts]
taxi-mlops = "taxi_mlops.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/taxi_mlops"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
