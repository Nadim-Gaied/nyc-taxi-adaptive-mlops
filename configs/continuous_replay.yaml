version: 1
timezone: America/New_York
expected_zones: 263

tracking:
  uri: sqlite:///data/mlflow/mlflow.db
  artifact_root: data/mlflow/artifacts
  experiment_name: nyc-taxi-production
  registered_model_name: nyc-taxi-demand
  reference_alias: accuracy-reference
  production_alias: champion

storage:
  feature_root: data/processed/features_monthly
  prediction_root: data/continuous_replay/predictions
  score_root: data/continuous_replay/scores
  model_root: data/continuous_replay/models
  state_db: data/continuous_replay/production.db
  monitoring_root: data/continuous_replay/monitoring

lifecycle:
  strategy: fixed_periodic_28d
  training_history: recent_365d
  retrain_every_calendar_days: 28
  statistical_promotion_gate: false
  technical_validation_required: true

monitoring:
  weekly_wape_warning: 0.142059
  weekly_wape_severe: 0.159875
  reporting_timezone: America/New_York
  drift_can_trigger_retraining_alone: false
  alert_window_hours: 168
  zone_lookback_days: 28
  alert_webhook_url_env: TAXI_MLOPS_ALERT_WEBHOOK_URL
  alert_webhook_timeout_seconds: 5
